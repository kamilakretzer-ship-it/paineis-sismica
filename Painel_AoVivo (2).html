<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Sísmica</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--preto:#1A1A1A;--grana:#B01E28;--grana2:#8A1820;--off:#F4F1EC;--branco:#fff;--cinza:#6B6862;--linha:#E3DED6;--verde:#1E7A46;--ambar:#C8881E;--azul:#2C5C8A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Spectral',Georgia,serif;background:var(--off);color:var(--preto);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px 80px}
header{background:var(--preto);color:var(--off);padding:38px 0 30px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;bottom:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--grana) 0 33%,var(--preto) 33% 50%,var(--grana2) 50% 66%,var(--preto) 66%)}
.hwrap{max-width:1080px;margin:0 auto;padding:0 24px}
.brand{font-family:'Archivo';font-weight:900;font-size:13px;text-transform:lowercase;opacity:.7}
h1{font-family:'Archivo';font-weight:900;font-size:clamp(28px,5vw,46px);line-height:1.02;letter-spacing:-1.5px;margin:6px 0 4px}
.sub{font-size:15px;opacity:.85;font-style:italic}
.meta{margin-top:14px;font-family:'Archivo';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6}
section{margin-top:46px}
.eyebrow{font-family:'Archivo';font-weight:800;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--grana);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--linha)}
h2{font-family:'Archivo';font-weight:800;font-size:24px;letter-spacing:-.5px;margin-bottom:4px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0 26px}
.kpi{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:20px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--grana)}
.kpi .n{font-family:'Archivo';font-weight:900;font-size:40px;line-height:1;letter-spacing:-2px}
.kpi .l{font-family:'Archivo';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--cinza);margin-top:8px}
.kpi.green::before{background:var(--verde)}.kpi.green .n{color:var(--verde)}
.kpi.amber::before{background:var(--ambar)}.kpi.amber .n{color:var(--ambar)}
.kpi.dark{background:var(--preto)}.kpi.dark .n{color:var(--off)}.kpi.dark .l{color:rgba(244,241,236,.6)}
.scope{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:26px}
.scope h3{font-family:'Archivo';font-weight:800;font-size:14px;margin-bottom:18px}
.bar-row{margin-bottom:20px}
.bar-row .top{display:flex;justify-content:space-between;font-family:'Archivo';font-size:12px;font-weight:600;margin-bottom:6px}
.track{height:26px;background:var(--off);border-radius:8px;overflow:hidden;border:1px solid var(--linha)}
.fill{height:100%;border-radius:7px 0 0 7px;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-family:'Archivo';font-weight:800;font-size:11px;color:#fff;transition:width 1.2s cubic-bezier(.2,.8,.2,1);width:0}
.fill.g{background:linear-gradient(90deg,var(--grana2),var(--grana))}
.fill.v{background:linear-gradient(90deg,#176038,var(--verde))}
.foco{margin-top:34px;background:var(--preto);border-radius:18px;padding:26px 28px;position:relative;overflow:hidden}
.foco::before{content:"";position:absolute;top:0;left:0;width:100%;height:5px;background:linear-gradient(90deg,var(--grana) 0 33%,transparent 33% 50%,var(--grana2) 50% 66%,transparent 66%)}
.foco .eyebrow{color:#ff9aa2}.foco .eyebrow::after{background:rgba(255,255,255,.15)}
.foco h2{color:var(--off);margin-bottom:16px}
.foco ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
@media(max-width:720px){.foco ul{grid-template-columns:1fr}}
.foco li{color:var(--off);font-size:15px;padding-left:30px;position:relative;line-height:1.4}
.foco li::before{content:"";position:absolute;left:0;top:2px;width:18px;height:18px;border:2px solid var(--grana);border-radius:5px}
.timeline{margin-top:18px;position:relative;padding-left:8px}
.tl-item{position:relative;padding:0 0 4px 38px;margin-bottom:14px}
.tl-item::before{content:"";position:absolute;left:9px;top:22px;bottom:-14px;width:2px;background:var(--linha)}
.tl-item:last-child::before{display:none}
.tl-dot{position:absolute;left:0;top:4px;width:20px;height:20px;border-radius:50%;background:var(--off);border:3px solid var(--ambar);z-index:2}
.tl-item.done .tl-dot{background:var(--verde);border-color:var(--verde)}
.tl-item.done .tl-dot::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900;font-family:'Archivo'}
.tl-card{background:var(--branco);border:1px solid var(--linha);border-radius:12px;padding:14px 18px}
.tl-item.done .tl-card{border-left:4px solid var(--verde)}
.tl-item.next .tl-card{border-left:4px solid var(--ambar);box-shadow:0 4px 18px rgba(200,136,30,.12)}
.tl-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:3px}
.tl-date{font-family:'Archivo';font-weight:900;font-size:14px;color:var(--grana)}
.tl-mod{font-family:'Archivo';font-weight:700;font-size:14px}
.tl-st{margin-left:auto;font-family:'Archivo';font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:5px}
.tl-st.r{background:rgba(30,122,70,.15);color:var(--verde)}.tl-st.p{background:rgba(200,136,30,.15);color:var(--ambar)}
.tl-foco{font-size:13px;color:var(--cinza);font-style:italic}
.tl-prog{margin-top:14px;background:var(--branco);border:1px solid var(--linha);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px}
.tl-prog .lbl{font-family:'Archivo';font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--cinza)}
.tl-prog .track{flex:1;height:10px;background:var(--off);border-radius:6px;overflow:hidden;border:1px solid var(--linha)}
.tl-prog .fill2{height:100%;background:linear-gradient(90deg,var(--verde),#34a865);border-radius:6px;width:0;transition:width 1.2s ease}
.tl-prog .cnt{font-family:'Archivo';font-weight:900;font-size:15px;color:var(--verde)}
.team{background:var(--branco);border:1px solid var(--linha);border-radius:16px;margin-bottom:16px;overflow:hidden}
.team-head{display:flex;align-items:center;gap:14px;padding:18px 22px;background:var(--preto);color:var(--off)}
.team-head .tag{font-family:'Archivo';font-weight:900;font-size:16px}
.team-head .mini{margin-left:auto;display:flex;gap:8px;font-family:'Archivo';font-size:11px}
.chip{padding:4px 10px;border-radius:20px;font-weight:700}.chip.ok{background:rgba(30,122,70,.25);color:#7fe0a6}.chip.owe{background:rgba(176,30,40,.3);color:#ff9aa2}
.item{padding:16px 22px;border-top:1px solid var(--linha)}.item:first-child{border-top:none}
.item .escopo{font-family:'Archivo';font-weight:700;font-size:15px;margin-bottom:3px}
.item .det{font-size:13px;color:var(--cinza);margin-bottom:10px}
.statusline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-family:'Archivo';font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:6px}
.b-Conc{background:rgba(30,122,70,.15);color:var(--verde)}.b-Em{background:rgba(44,92,138,.15);color:var(--azul)}
.b-Atra,.b-Bloq{background:rgba(176,30,40,.15);color:var(--grana)}.b-Nao{background:var(--off);color:var(--cinza)}
.minibar{flex:1;min-width:120px;height:7px;background:var(--off);border-radius:5px;overflow:hidden;border:1px solid var(--linha)}
.minibar span{display:block;height:100%;background:var(--grana);border-radius:5px}
.prazo{font-family:'Archivo';font-size:11px;font-weight:700;color:var(--cinza)}
.eff,.nxt{font-size:13px;padding:8px 12px;border-radius:8px;margin-top:6px}
.eff{background:rgba(30,122,70,.07);border-left:3px solid var(--verde)}.nxt{background:rgba(44,92,138,.07);border-left:3px solid var(--azul)}
.eff b,.nxt b{font-family:'Archivo';font-size:10px;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:2px}
.eff b{color:var(--verde)}.nxt b{color:var(--azul)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:720px){.cols{grid-template-columns:1fr}}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:22px}
.card.good{border-top:4px solid var(--verde)}.card.owe{border-top:4px solid var(--grana)}
.card h3{font-family:'Archivo';font-weight:800;font-size:15px;margin-bottom:12px}
.card ul{list-style:none}.card li{padding:9px 0 9px 24px;position:relative;font-size:14px;border-top:1px dashed var(--linha)}.card li:first-child{border-top:none}
.card.good li::before{content:"✓";position:absolute;left:0;color:var(--verde);font-weight:800}
.card.owe li::before{content:"!";position:absolute;left:2px;color:var(--grana);font-weight:900;font-family:'Archivo'}
.next li::before{content:"→";color:var(--azul);font-weight:800}
.donut-wrap{background:var(--branco);border:1px solid var(--linha);border-radius:16px;padding:26px;display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.donut{--p:0;width:160px;height:160px;border-radius:50%;background:conic-gradient(var(--verde) calc(var(--p)*1%),var(--ambar) 0);position:relative;flex-shrink:0}
.donut::after{content:"";position:absolute;inset:18px;background:var(--branco);border-radius:50%}
.donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.donut .c b{font-family:'Archivo';font-weight:900;font-size:34px;color:var(--verde)}
.donut .c span{font-family:'Archivo';font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--cinza)}
.leg{flex:1;min-width:200px}.leg div{display:flex;align-items:center;gap:10px;padding:8px 0;font-family:'Archivo';font-size:14px;border-bottom:1px dashed var(--linha)}
.leg .dot{width:12px;height:12px;border-radius:3px}
footer{margin-top:50px;padding-top:20px;border-top:1px solid var(--linha);font-family:'Archivo';font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--cinza);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grana);margin-right:6px;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.loading{text-align:center;padding:80px 20px;font-family:'Archivo';color:var(--cinza)}
.spin{width:36px;height:36px;border:3px solid var(--linha);border-top-color:var(--grana);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
.err{background:#fff;border:1px solid var(--linha);border-left:4px solid var(--grana);border-radius:12px;padding:24px;margin-top:40px}
.err h3{font-family:'Archivo';color:var(--grana);margin-bottom:8px}
.updated{font-family:'Archivo';font-size:10px;color:var(--cinza);text-transform:uppercase;letter-spacing:1px}
</style></head>
<body>
<header><div class="hwrap">
 <div class="brand">sísmica · gestão de projetos</div>
 <h1 id="h-nome">Carregando…</h1>
 <div class="sub" id="h-prog"></div>
 <div class="meta" id="h-meta"></div>
</div></header>
<div class="wrap" id="root">
 <div class="loading"><div class="spin"></div>Carregando dados ao vivo da planilha…</div>
</div>

<script>
// ============ CONFIGURAÇÃO ============
// Cole aqui o ID da sua planilha Google (está na URL entre /d/ e /edit)
const SHEET_ID = "1FFhm3fG22X9fAv7PxN4Mu808ArcjuF9WTOfAVOc33KM";
// ======================================

const PROGRAMAS = ["Mitre","Arqos","Kempinski","Tamboré","Foment"];
const params = new URLSearchParams(location.search);
const CLIENTE = params.get("cliente") || "Mitre";

function csvUrl(sheet){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}`;
}
// parser CSV simples e robusto (lida com aspas e vírgulas internas)
function parseCSV(text){
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false;} else cur+=c;}
    else{ if(c==='"')q=true; else if(c===','){row.push(cur);cur="";} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur="";} else if(c==='\r'){} else cur+=c;}
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows;
}
async function fetchSheet(sheet){
  const r=await fetch(csvUrl(sheet)); if(!r.ok) throw new Error("fetch "+sheet);
  const rows=parseCSV(await r.text()); const head=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>c.trim()!=="")).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||"").trim());return o;});
}
function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function badgeClass(st){st=(st||"").toLowerCase();if(st.startsWith("conc"))return"b-Conc";if(st.startsWith("em"))return"b-Em";if(st.startsWith("atra"))return"b-Atra";if(st.startsWith("bloq"))return"b-Bloq";return"b-Nao";}

async function renderLoginNPS(){
  try{
    const login=await fetchSheet(`${CLIENTE}_Login`);
    const nps_data=await fetchSheet(`${CLIENTE}_NPS`);
    
    let loginH="";
    if(login.length){
      const zero=login.filter(l=>parseInt(l["Contador de logins"]||0)===0).length;
      const comAcesso=login.length-zero;
      loginH=`<div class="cols" style="margin-bottom:24px"><div class="card"><h3>Contador de Login</h3>
       <div style="padding:16px 0;text-align:center">
        <div style="font-family:'Archivo';font-size:13px;color:var(--cinza);margin-bottom:12px">Com 0 acessos</div>
        <div style="font-family:'Archivo';font-weight:900;font-size:48px;color:var(--grana);margin-bottom:16px">${zero}</div>
        <div style="font-family:'Archivo';font-size:13px;color:var(--cinza);margin-bottom:12px">Com 1+ acessos</div>
        <div style="font-family:'Archivo';font-weight:900;font-size:48px;color:var(--verde);margin-bottom:8px">${comAcesso}</div>
        <div style="font-family:'Archivo';font-size:11px;color:var(--cinza);letter-spacing:1px;text-transform:uppercase;margin-top:16px">Total: ${login.length}</div>
       </div></div>`;
    }
    
    let npsH="";
    if(nps_data.length){
      const promotores=nps_data.filter(n=>{const a=parseInt(n.Avaliação||0);return a>=4;}).length;
      const neutros=nps_data.filter(n=>parseInt(n.Avaliação||0)===3).length;
      const detratores=nps_data.filter(n=>{const a=parseInt(n.Avaliação||0);return a<=2;}).length;
      const total=promotores+neutros+detratores;
      const npsValue=total>0?Math.round((promotores-detratores)/total*100):0;
      
      npsH=`<div class="card"><h3>NPS (Net Promoter Score)</h3>
       <div style="padding:16px 0;text-align:center">
        <div style="font-family:'Archivo';font-size:48px;font-weight:900;color:var(--grana);margin-bottom:24px">${npsValue}%</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-family:'Archivo';font-size:11px;text-transform:uppercase;letter-spacing:1px">
         <div><div style="color:var(--verde);font-weight:700;margin-bottom:6px">Promotores</div><div style="font-weight:900;font-size:18px;color:var(--verde)">${promotores}</div></div>
         <div><div style="color:var(--cinza);font-weight:700;margin-bottom:6px">Neutros</div><div style="font-weight:900;font-size:18px;color:var(--cinza)">${neutros}</div></div>
         <div><div style="color:var(--grana);font-weight:700;margin-bottom:6px">Detratores</div><div style="font-weight:900;font-size:18px;color:var(--grana)">${detratores}</div></div>
        </div>
       </div></div></div>`;
    }
    
    return loginH || npsH ? `<section><div class="eyebrow">Plataforma</div><h2>Top de plataforma</h2>${loginH}${npsH}` : "";
  }catch(e){
    return ``; 
  }
}

async function renderPrograma(){
  const [dem, meta, cron] = await Promise.all([fetchSheet(CLIENTE), fetchSheet("_META"), fetchSheet("_CRON")]);
  const m = meta.filter(x=>x.Cliente===CLIENTE);
  const info = m[0]||{};
  const foco = m.map(x=>x.FocoItem).filter(Boolean);
  document.getElementById("h-nome").textContent=CLIENTE;
  document.getElementById("h-prog").textContent=info.Programa||"";
  document.getElementById("h-meta").textContent=`Relatório semanal · ${info.Periodo||""} · atualizado ${new Date().toLocaleDateString("pt-BR")}`;

  const pcts=dem.map(d=>{let v=parseFloat((d.Pct||"0").replace(",","."))||0; if(v>1)v=v/100; return v;});
  const pct=Math.round(pcts.reduce((a,b)=>a+b,0)/(pcts.length||1)*100);
  const concl=dem.filter(d=>(d.Status||"").toLowerCase().startsWith("conc")).length;
  const total=dem.length;
  const pend=dem.filter(d=>(d.Devendo||"").toLowerCase()==="sim").length;
  const contr=parseInt(info.Contratado||"0")||0, real=parseInt(info.Realizados||"0")||0;
  const realpct=contr?Math.round(real/contr*100):0;

  // foco
  let focoH="";
  if(foco.length){focoH=`<div class="foco"><div class="eyebrow">Prioridades</div><h2>Foco desta semana</h2><ul>${foco.map(f=>`<li>${esc(f)}</li>`).join("")}</ul></div>`;}

  // panorama
  const pano=`<section><div class="eyebrow">Panorama</div><h2>Onde o programa está</h2>
    <div class="info-grid">
     <div class="kpi"><div class="n">${pct}%</div><div class="l">do escopo concluído</div></div>
     <div class="kpi green"><div class="n">${concl}</div><div class="l">entregas concluídas</div></div>
     <div class="kpi dark"><div class="n">${total}</div><div class="l">demandas no contrato</div></div>
     <div class="kpi amber"><div class="n">${pend}</div><div class="l">itens em aberto</div></div></div>
    <div class="scope"><h3>Contratado × Entregue</h3>
     <div class="bar-row"><div class="top"><span>Encontros realizados</span><span>${real} / ${contr}</span></div>
      <div class="track"><div class="fill v" data-w="${realpct}"> ${real}</div></div></div>
     <div class="bar-row"><div class="top"><span>Escopo geral executado</span><span>${pct}%</span></div>
      <div class="track"><div class="fill g" data-w="${pct}"> ${pct}%</div></div></div></div></section>`;

  // timeline
  const enc=cron.filter(x=>x.Cliente===CLIENTE);
  let tlH="";
  if(enc.length){
    const done=enc.filter(e=>(e.Status||"")==="Realizado").length, tot=enc.length, pp=Math.round(done/tot*100);
    let nextMark=false;
    const items=enc.map(e=>{const isd=(e.Status||"")==="Realizado";let cls=isd?"done":"";const sc=isd?"r":"p";if(!isd&&!nextMark){cls="next";nextMark=true;}
      return `<div class="tl-item ${cls}"><div class="tl-dot"></div><div class="tl-card"><div class="tl-top">
       <span class="tl-date">${esc(e.Data)}</span><span class="tl-mod">${esc(e.Modulo)}</span>
       <span class="tl-st ${sc}">${esc(e.Status)}</span></div><div class="tl-foco">${esc(e.Foco)}</div></div></div>`;}).join("");
    tlH=`<section><div class="eyebrow">Cronograma</div><h2>Encontros contratados · entregas</h2>
     <div class="tl-prog"><span class="lbl">Realizados</span><div class="track"><div class="fill2" data-w="${pp}"></div></div><span class="cnt">${done}/${tot}</span></div>
     <div class="timeline">${items}</div></section>`;
  }

  // equipes
  const byTeam={};dem.forEach(d=>{(byTeam[d.Equipe]=byTeam[d.Equipe]||[]).push(d);});
  let teamsH="";
  for(const eq in byTeam){const its=byTeam[eq];
    const nok=its.filter(i=>(i.Status||"").toLowerCase().startsWith("conc")).length;
    const nowe=its.filter(i=>(i.Devendo||"").toLowerCase()==="sim").length;
    let mini="";if(nok)mini+=`<span class="chip ok">${nok} ok</span>`;if(nowe)mini+=`<span class="chip owe">${nowe} devendo</span>`;
    const rowsH=its.map(i=>{let pv=parseFloat((i.Pct||"0").replace(",","."))||0; if(pv>1)pv=pv/100; const p=Math.round(pv*100);
      const eff=(i.Efeito&&i.Efeito!=="—")?`<div class="eff"><b>Efeito</b>${esc(i.Efeito)}</div>`:"";
      const nxt=i.Proximo?`<div class="nxt"><b>Próximo passo</b>${esc(i.Proximo)}</div>`:"";
      return `<div class="item"><div class="escopo">${esc(i.Demanda)}</div><div class="det">${esc(i.Detalhe)}</div>
       <div class="statusline"><span class="badge ${badgeClass(i.Status)}">${esc(i.Status)}</span>
        <div class="minibar"><span style="width:${p}%"></span></div><span class="prazo">${esc(i.Prazo)}</span></div>${eff}${nxt}</div>`;}).join("");
    teamsH+=`<div class="team"><div class="team-head"><span class="tag">${esc(eq)}</span><div class="mini">${mini}</div></div>${rowsH}</div>`;
  }
  const teams=`<section><div class="eyebrow">Por equipe</div><h2>Ações e efeitos da semana</h2>${teamsH}</section>`;

  // listas
  const good=dem.filter(i=>(i.Status||"").toLowerCase().startsWith("conc")||(i.Efeito&&i.Efeito!=="—"));
  const goodH=good.length?good.map(i=>`<li>${esc(i.Demanda)} — ${esc(i.Efeito)}</li>`).join(""):"<li>Programa em fase inicial.</li>";
  const owe=dem.filter(i=>(i.Devendo||"").toLowerCase()==="sim");
  const oweH=owe.length?owe.map(i=>`<li>${esc(i.Demanda)} <small>(${esc(i.Equipe)})</small></li>`).join(""):"<li>Nenhuma pendência. 🎉</li>";
  const nxts=dem.filter(i=>i.Proximo&&!(i.Status||"").toLowerCase().startsWith("conc"));
  const nxtH=nxts.map(i=>`<li><b style="font-family:Archivo;font-size:11px;color:var(--grana)">${esc(i.Equipe)}</b> · ${esc(i.Proximo)}</li>`).join("");
  const resumo=`<section><div class="eyebrow">Leitura rápida</div><h2>Estamos indo bem · O que falta</h2>
    <div class="cols"><div class="card good"><h3>O que vai bem</h3><ul>${goodH}</ul></div>
     <div class="card owe"><h3>O que ainda devemos</h3><ul>${oweH}</ul></div></div></section>
    <section><div class="eyebrow">Direção</div><h2>Próximos passos</h2><div class="card next"><ul>${nxtH}</ul></div></section>`;

  const plat = await renderLoginNPS();
  document.getElementById("root").innerHTML = focoH+pano+tlH+teams+resumo+plat+footer();
  animate();
}

async function renderPlataforma(){
  const plat=await fetchSheet("_PLAT");
  const d=plat.find(x=>(x.Cliente||"").trim()===CLIENTE);
  if(!d){throw new Error("cliente não encontrado em _PLAT");}
  const total=parseInt((d.Total||"").toString().replace(/[^\d]/g,""))||0;
  const inat=parseInt((d.Inativos||"").toString().replace(/[^\d]/g,""))||0;
  const ativos=total-inat;
  const novos=parseInt((d.Novos||"").toString().replace(/[^\d]/g,""))||0;
  const ap=total?Math.round(ativos/total*100):0;
  const manut=(d.Manutencao||"").toLowerCase().includes("sim");
  document.getElementById("h-nome").textContent=CLIENTE;
  document.getElementById("h-prog").textContent=manut?"Manutenção de plataforma · usuários":"Acompanhamento de plataforma";
  document.getElementById("h-meta").textContent=`Relatório de adesão · atualizado ${new Date().toLocaleDateString("pt-BR")}`;
  let kpis=`<div class="kpi green"><div class="n">${ativos}</div><div class="l">corretores ativos</div></div>
   <div class="kpi amber"><div class="n">${inat}</div><div class="l">inativos</div></div>`;
  if(novos)kpis+=`<div class="kpi"><div class="n">${novos}</div><div class="l">novos no mês</div></div>`;
  kpis+=`<div class="kpi dark"><div class="n">${total}</div><div class="l">base total</div></div>`;
  let leg=`<div><span class="dot" style="background:var(--verde)"></span>Ativos — ${ativos} (${ap}%)</div>
   <div><span class="dot" style="background:var(--ambar)"></span>Inativos — ${inat}</div>`;
  if(novos)leg+=`<div><span class="dot" style="background:var(--grana)"></span>Novos no mês — ${novos}</div>`;
  let rel = manut
    ? `<section><div class="eyebrow">Observação</div><h2>Acompanhamento</h2><div class="card"><p style="font-size:14px;color:var(--cinza)">${esc(d.Obs)}</p></div></section>`
    : `<section><div class="eyebrow">Relacionamento</div><h2>Como estamos presentes</h2>
       <div class="card owe"><h3>Presença comercial / próximo passo</h3><p style="font-size:15px">${esc(d.Presenca)}</p></div>
       <div class="card"><h3>Observação</h3><p style="font-size:14px;color:var(--cinza)">${esc(d.Obs)}</p></div></section>`;
  const html=`<section><div class="eyebrow">Adesão</div><h2>Como está a base na plataforma</h2><div class="info-grid">${kpis}</div></section>
    <section><div class="eyebrow">Engajamento</div><h2>Ativos × inativos</h2>
     <div class="donut-wrap"><div class="donut" style="--p:${ap}"><div class="c"><b>${ap}%</b><span>ativos</span></div></div>
      <div class="leg">${leg}</div></div></section>${rel}`;
  document.getElementById("root").innerHTML=html+footer();
}

function footer(){return `<footer><span><span class="pulse"></span>Sísmica · Conectividade Consultoria</span><span>Documento interno — ${esc(CLIENTE)}</span></footer>`;}
function animate(){document.querySelectorAll(".fill,.fill2").forEach(f=>{setTimeout(()=>f.style.width=f.dataset.w+"%",150);});}

async function main(){
  if(SHEET_ID==="COLE_AQUI_O_ID_DA_PLANILHA"){
    document.getElementById("root").innerHTML=`<div class="err"><h3>Falta configurar a planilha</h3>
     <p>Abra este arquivo e cole o ID da sua planilha Google no campo SHEET_ID (veja o guia que acompanha os arquivos).</p></div>`;
    document.getElementById("h-nome").textContent="Configuração pendente";return;
  }
  try{
    if(PROGRAMAS.includes(CLIENTE)) await renderPrograma();
    else await renderPlataforma();
  }catch(e){
    document.getElementById("h-nome").textContent="Erro ao carregar";
    let dica = "";
    const msg = String(e.message||e);
    if(msg.includes("fetch")){
      dica = `<p style="margin-top:8px">Causa provável: a planilha ainda não está liberada para leitura pública. Verifique no botão <b>Compartilhar</b> se está como <b>"Qualquer pessoa com o link · Leitor"</b> (isso é separado de "Publicar na Web").</p>`;
    }
    document.getElementById("root").innerHTML=`<div class="err"><h3>Não consegui ler a planilha</h3>
     <p>Cliente solicitado no link: <b>?cliente=${esc(CLIENTE)}</b> — precisa existir uma aba com esse nome exato.</p>
     ${dica}
     <p style="color:var(--cinza);font-size:13px;margin-top:10px">Detalhe técnico: ${esc(msg)}</p>
     <p style="color:var(--cinza);font-size:12px;margin-top:6px">ID configurado: ${esc(SHEET_ID.slice(0,12))}…</p></div>`;
  }
}
main();
</script>
</body></html>
